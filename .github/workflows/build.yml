name: ChromeVale Linux build

on:
  workflow_dispatch:
  push:
    branches: [chromevale-permissions-fix]
  pull_request:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Linux build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt-get update -q
          apt-get install -y -q ca-certificates wget gnupg git cmake ninja-build binutils python3 libboost-dev
          wget -qO /usr/share/keyrings/llvm.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main' > /etc/apt/sources.list.d/llvm.list
          apt-get update -q
          apt-get install -y -q clang-18 libc++-18-dev libc++abi-18-dev

      - name: Checkout patched source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DPRIMEBDS_BUILD_TESTS=ON

      - name: Build plugin and regression tests
        run: cmake --build build/linux --parallel 2

      - name: Run regression tests
        run: ctest --test-dir build/linux --output-on-failure

      - name: Verify Linux compatibility and package provenance
        run: |
          set -euo pipefail
          binary=build/linux/output/endstone_primebds.so
          test -s "$binary"
          readelf -h "$binary"
          objdump -T "$binary" > build/linux/symbols.txt
          max_glibc=$(grep -oP 'GLIBC_\K[0-9.]+' build/linux/symbols.txt | sort -Vu | tail -1)
          test -n "$max_glibc"
          if [ "$(printf '%s\n' '2.35' "$max_glibc" | sort -V | tail -1)" != '2.35' ]; then
            echo "::error::Requires GLIBC_$max_glibc; host compatibility limit is 2.35."
            exit 1
          fi
          cd build/linux/output
          sha256sum endstone_primebds.so > SHA256SUMS
          printf 'PrimeBDS ChromeVale permission fix\nSource commit: %s\nBranch: %s\nBuild run: %s/%s/actions/runs/%s\nMaximum GLIBC: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$max_glibc" > BUILD-INFO.txt

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: primebds-chromevale-linux-${{ github.sha }}
          path: build/linux/output/
          if-no-files-found: error
          retention-days: 30
